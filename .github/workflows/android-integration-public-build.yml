name: EventMenu GO Integration Build

on:
  push:
    branches:
      - eventmenu-go/integration-no-actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-go-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore development signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/.github/signing/eventmenu-go-debug.keystore.b64" > "$HOME/.android/eventmenu-go-debug.keystore"
          chmod 600 "$HOME/.android/eventmenu-go-debug.keystore"
          echo "EVENTMENU_DEBUG_KEYSTORE_PATH=$HOME/.android/eventmenu-go-debug.keystore" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='br.com.eventmenu.go'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-INTEGRADO
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
