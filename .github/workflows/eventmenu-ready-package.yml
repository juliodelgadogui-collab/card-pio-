name: EventMenu Ready Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main, eventmenu-go/server-continue-no-actions]
    paths:
      - 'mobile/eventmenu-go/**'
      - 'app/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'database/**'
      - 'composer.*'
      - '.github/workflows/eventmenu-ready-package.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-APK-Delivery-Fix
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
