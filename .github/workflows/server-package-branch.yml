name: EventMenu Server Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-go-server-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Start local MySQL
        run: |
          sudo systemctl start mysql.service
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then break; fi
            sleep 1
          done
          sudo mysql <<'SQL'
          CREATE DATABASE IF NOT EXISTS eventmenu CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'eventmenu'@'%' IDENTIFIED BY 'eventmenu';
          ALTER USER 'eventmenu'@'%' IDENTIFIED BY 'eventmenu';
          GRANT ALL PRIVILEGES ON eventmenu.* TO 'eventmenu'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: MySQL EventMenu GO support smoke
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: package-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: eventmenu
          DB_USERNAME: eventmenu
          DB_PASSWORD: eventmenu
          SESSION_NAME: eventmenu_go_support_mysql
        run: |
          php scripts/ci-db-smoke.php
          php scripts/ci-eventmenu-go-hub-smoke.php
          php scripts/ci-delivery-tracking-smoke.php
          php scripts/ci-customer-communication-smoke.php

  server-package:
    needs: [mysql-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax validation
        run: find app public src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite smoke validation
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: package-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-package.sqlite
          SESSION_NAME: eventmenu_package_sqlite
        run: |
          rm -f /tmp/eventmenu-package.sqlite /tmp/eventmenu-package.sqlite-shm /tmp/eventmenu-package.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-operations-smoke.php
          php scripts/ci-delivery-tracking-smoke.php
          php scripts/ci-customer-communication-smoke.php
          php scripts/ci-eventmenu-go-hub-smoke.php
      - name: Build complete server package
        env:
          EVENTMENU_RELEASE_VERSION: server-support-2026-09-10
          EVENTMENU_BUILD_COMMIT: ${{ github.sha }}
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-Servidor-COMPLETO"
      - name: Verify complete server modules
        run: |
          PACKAGE="$RUNNER_TEMP/EventMenu-Premium-Servidor-COMPLETO"
          test -f "$PACKAGE/index.php"
          test -f "$PACKAGE/install.php"
          test -f "$PACKAGE/update.php"
          test -f "$PACKAGE/cron.php"
          test -f "$PACKAGE/public/assets/premium-v4.css"
          test -f "$PACKAGE/public/api-go-delivery.php"
          test -f "$PACKAGE/public/api-go-expedition.php"
          test -f "$PACKAGE/public/api-go-inventory.php"
          test -f "$PACKAGE/public/api-hub.php"
          test -f "$PACKAGE/public/api-delivery-manager-live.php"
          test -f "$PACKAGE/public/api-delivery-track.php"
          test -f "$PACKAGE/public/rastreio.php"
          test -f "$PACKAGE/app/routes/delivery.php"
          test -f "$PACKAGE/app/routes/whatsapp-settings.php"
          test -f "$PACKAGE/src/Services/DeliveryTrackingService.php"
          test -f "$PACKAGE/src/Services/DeliveryPublicTrackingService.php"
          test -f "$PACKAGE/src/Services/DeliveryProgressService.php"
          test -f "$PACKAGE/src/Services/ExpeditionDeliveryService.php"
          test -f "$PACKAGE/src/Services/InventorySnapshotService.php"
          test -f "$PACKAGE/src/Services/CustomerCommunicationService.php"
          test -f "$PACKAGE/src/Services/HubService.php"
          test -f "$PACKAGE/src/Services/HubDesktopPresenceService.php"
          test -f "$PACKAGE/src/Services/HubCommandIdempotencyGuardService.php"
          test -f "$PACKAGE/src/Services/HubTerminalCatalogService.php"
          test -f "$PACKAGE/database/migrations/099_delivery_live_tracking.sql"
          test -f "$PACKAGE/database/migrations/100_delivery_tracking_tokens.sql"
          test -f "$PACKAGE/database/migrations/101_delivery_tracking_telemetry.sql"
          test -f "$PACKAGE/database/migrations/102_customer_communications.sql"
          test -f "$PACKAGE/database/migrations/103_eventmenu_hub_shared.sql"
          test -f "$PACKAGE/database/sqlite/migrations/099_delivery_live_tracking.sql"
          test -f "$PACKAGE/database/sqlite/migrations/100_delivery_tracking_tokens.sql"
          test -f "$PACKAGE/database/sqlite/migrations/101_delivery_tracking_telemetry.sql"
          test -f "$PACKAGE/database/sqlite/migrations/102_customer_communications.sql"
          test -f "$PACKAGE/database/sqlite/migrations/103_eventmenu_hub_shared.sql"
          test -f "$PACKAGE/scripts/ci-eventmenu-go-hub-smoke.php"
          test -d "$PACKAGE/vendor"
          test -f "$PACKAGE/vendor/autoload.php"
          test -d "$PACKAGE/storage"
          grep -q '^APP_BASE_PATH=/1$' "$PACKAGE/.env.example"
          grep -q '^DB_CONNECTION=sqlite$' "$PACKAGE/.env.example"
          grep -q '^DELIVERY_GPS_HISTORY_DAYS=7$' "$PACKAGE/.env.example"
      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP/EventMenu-Premium-Servidor-COMPLETO"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-Servidor-COMPLETO
          path: ${{ runner.temp }}/EventMenu-Premium-Servidor-COMPLETO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
