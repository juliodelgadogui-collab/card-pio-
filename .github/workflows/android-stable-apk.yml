name: EventMenu GO Atualizável

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-go-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-stable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4

      - name: Verify EventMenu GO mobile-sync sources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/br/com/eventmenu/go/HubViewModel.kt
          test -f app/src/main/java/br/com/eventmenu/go/ExpeditionStatusViewModel.kt
          test -f app/src/main/java/br/com/eventmenu/go/data/HubRepository.kt
          test -f app/src/main/java/br/com/eventmenu/go/data/InventoryAlertRepository.kt
          test -f app/src/main/java/br/com/eventmenu/go/data/ExpeditionStatusRepository.kt
          test -f app/src/main/java/br/com/eventmenu/go/data/FailoverEndpointRouter.kt
          test -f app/src/main/java/br/com/eventmenu/go/data/ClientPolicyManager.kt
          test -f app/src/main/java/br/com/eventmenu/go/location/DeliveryLocationService.kt
          test -f app/src/main/java/br/com/eventmenu/go/location/DeliveryLocationBuffer.kt
          test -f app/src/main/java/br/com/eventmenu/go/location/LocationPermissionActivity.kt
          grep -q 'api-hub.php' app/src/main/java/br/com/eventmenu/go/data/ApiClient.kt
          grep -q 'api-app-config.php' app/src/main/java/br/com/eventmenu/go/data/ApiClient.kt
          grep -q 'api-go-routing.php' app/src/main/java/br/com/eventmenu/go/data/ApiClient.kt
          grep -q 'api-client-policy.php' app/src/main/java/br/com/eventmenu/go/data/ApiClient.kt
          grep -q 'api-cluster.php' app/src/main/java/br/com/eventmenu/go/data/ApiClient.kt
          grep -q 'bootstrapControlPlane' app/src/main/java/br/com/eventmenu/go/EventMenuGoApplication.kt
          grep -q 'FailoverEndpointRouter.initialize' app/src/main/java/br/com/eventmenu/go/EventMenuGoApplication.kt
          grep -q 'ClientPolicyManager.initialize' app/src/main/java/br/com/eventmenu/go/EventMenuGoApplication.kt
          grep -q 'ClientPolicyManager.featureEnabled("hub"' app/src/main/java/br/com/eventmenu/go/ui/EventMenuGoHubShell.kt
          grep -q 'ApiServerRole.CONTINGENCY' app/src/main/java/br/com/eventmenu/go/MainActivity.kt
          grep -q 'trackingLink(order.id)' app/src/main/java/br/com/eventmenu/go/ui/screens/DeliveryOperationsScreen.kt
          grep -q 'WhatsApp' app/src/main/java/br/com/eventmenu/go/ui/screens/DeliveryOperationsScreen.kt
          grep -q 'DeliveryLocationService' app/src/main/java/br/com/eventmenu/go/DeliveryProgressViewModel.kt
          echo "EventMenu GO mobile-sync + failover + signed client policy sources OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore permanent development signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/.github/signing/eventmenu-go-debug.keystore.b64" > "$HOME/.android/eventmenu-go-debug.keystore"
          chmod 600 "$HOME/.android/eventmenu-go-debug.keystore"
          EXPECTED='FF:0F:ED:2C:77:D0:18:96:08:CE:DD:BF:20:6B:B1:AD:A5:E5:23:59:79:74:BB:75:9F:D2:C5:DF:3F:8C:8C:FF'
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/eventmenu-go-debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          echo "Development certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "EVENTMENU_DEBUG_KEYSTORE_PATH=$HOME/.android/eventmenu-go-debug.keystore" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run EventMenu GO unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble updateable EventMenu GO APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          EXPECTED='FF:0F:ED:2C:77:D0:18:96:08:CE:DD:BF:20:6B:B1:AD:A5:E5:23:59:79:74:BB:75:9F:D2:C5:DF:3F:8C:8C:FF'
          ACTUAL="$(keytool -printcert -jarfile "$APK" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          echo "APK certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='br.com.eventmenu.go'"

      - name: Upload updateable APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-ATUALIZAVEL
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
