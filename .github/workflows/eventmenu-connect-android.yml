name: EventMenu Connect Android

on:
  push:
    branches:
      - wip/eventmenu-delivery-customer-auth-payments
    paths:
      - 'mobile/eventmenu-connect/**'
      - '.github/workflows/eventmenu-connect-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-connect-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore stable EventMenu Connect debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-connect-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu Connect Development,O=EventMenu,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EventMenu-Connect-Teste.apk
          sha256sum dist/EventMenu-Connect-Teste.apk > dist/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Connect-APK
          path: mobile/eventmenu-connect/dist/*
          if-no-files-found: error
          retention-days: 14
