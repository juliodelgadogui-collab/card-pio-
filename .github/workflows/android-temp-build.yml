name: EventMenu GO APK TEMP

on:
  push:
    branches:
      - tmp/eventmenu-go-apk-build-20260917

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore development signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/.github/signing/eventmenu-go-debug.keystore.b64" > "$HOME/.android/eventmenu-go-debug.keystore"
          chmod 600 "$HOME/.android/eventmenu-go-debug.keystore"
          echo "EVENTMENU_DEBUG_KEYSTORE_PATH=$HOME/.android/eventmenu-go-debug.keystore" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "EVENTMENU_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK package
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='br.com.eventmenu.go'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-ENTREGAS-CORRIGIDAS
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
