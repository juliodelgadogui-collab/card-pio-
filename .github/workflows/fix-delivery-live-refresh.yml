name: Fix EventMenu GO delivery live refresh

on:
  push:
    branches: [fix/delivery-live-refresh-20260917]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delivery-live-refresh-20260917
      - name: Patch delivery refresh flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile/eventmenu-go/app/src/main/java/br/com/eventmenu/go/ui/EventMenuGoApp.kt')
          s=p.read_text()
          old='''        if (state.workShift?.mode == "delivery") deliveryProgressViewModel.refresh()\n        while (true) { delay(10_000); viewModel.refreshNotifications() }'''
          new='''        if (state.workShift?.mode == "delivery") {\n            viewModel.refreshOrders()\n            deliveryProgressViewModel.refresh()\n        }\n        while (true) {\n            delay(if (state.workShift?.mode == "delivery") 5_000 else 10_000)\n            if (state.workShift?.mode == "delivery") {\n                viewModel.refreshOrders()\n                deliveryProgressViewModel.refresh()\n            } else {\n                viewModel.refreshNotifications()\n            }\n        }'''
          if old not in s: raise SystemExit('refresh loop anchor not found')
          s=s.replace(old,new,1)
          old='''        if (state.screen == AppScreen.DELIVERY && state.workShift?.mode == "delivery") deliveryProgressViewModel.refresh()'''
          new='''        if (state.screen == AppScreen.DELIVERY && state.workShift?.mode == "delivery") { viewModel.refreshOrders(); deliveryProgressViewModel.refresh() }'''
          if old not in s: raise SystemExit('delivery screen anchor not found')
          s=s.replace(old,new,1)
          old='''AppScreen.DELIVERY -> DeliveryOperationsScreen(state.orders, deliveryProgressState.items, state.pixCharge, deliveryProgressViewModel::refresh,'''
          new='''AppScreen.DELIVERY -> DeliveryOperationsScreen(state.orders, deliveryProgressState.items, state.pixCharge, { viewModel.refreshOrders(); deliveryProgressViewModel.refresh() },'''
          if old not in s: raise SystemExit('delivery callback anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify anchors and compile Kotlin
        run: |
          grep -q 'delay(if (state.workShift?.mode == "delivery") 5_000 else 10_000)' mobile/eventmenu-go/app/src/main/java/br/com/eventmenu/go/ui/EventMenuGoApp.kt
          cd mobile/eventmenu-go
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/eventmenu-go/app/src/main/java/br/com/eventmenu/go/ui/EventMenuGoApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(go): refresh assigned deliveries live'
          git push origin HEAD:fix/delivery-live-refresh-20260917
