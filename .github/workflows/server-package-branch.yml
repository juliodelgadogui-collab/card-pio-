name: EventMenu Server Package
on:
  workflow_dispatch:
  push:
    branches: [dev/eventmenu-server]
    paths: ['.github/workflows/server-package-branch.yml','app/**','public/**','src/**','database/**','scripts/**','composer.json','composer.lock','.env.example']
permissions: {contents: read}
jobs:
  server-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'curl, mbstring, openssl, pdo_sqlite', coverage: none}
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax validation
        run: find app public src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite smoke validation
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: package-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test/1
          APP_BASE_PATH: /1
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-package.sqlite
          SESSION_NAME: eventmenu_package_sqlite
        run: |
          rm -f /tmp/eventmenu-package.sqlite /tmp/eventmenu-package.sqlite-shm /tmp/eventmenu-package.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-permission-smoke.php
          php scripts/ci-sensitive-rate-limit-smoke.php
          php scripts/ci-operations-smoke.php
          php scripts/ci-customer-identity-smoke.php
          php scripts/ci-loyalty-points-smoke.php
          php scripts/ci-payment-invariants-smoke.php
          php scripts/ci-auth-mail-smoke.php
          php scripts/ci-url-smoke.php
          php scripts/ci-backup-smoke.php
          php scripts/ci-operational-resilience-smoke.php
          php scripts/ci-production-readiness-smoke.php
      - name: Build SQLite server package
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-Servidor-dev"
      - name: Verify receipt contract
        run: |
          PACKAGE="$RUNNER_TEMP/EventMenu-Premium-Servidor-dev"
          test -f "$PACKAGE/public/api-go-receipts.php"
          test -f "$PACKAGE/src/Services/ReceiptPresentationService.php"
          test -f "$PACKAGE/app/routes/receipt-settings.php"
          test -f "$PACKAGE/app/routes/receipt-ads.php"
      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP/EventMenu-Premium-Servidor-dev"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: EventMenu-Premium-Servidor-dev, path: '${{ runner.temp }}/EventMenu-Premium-Servidor-dev', if-no-files-found: error, include-hidden-files: true, retention-days: 7}