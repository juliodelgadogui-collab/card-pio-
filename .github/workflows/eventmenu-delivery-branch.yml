name: DELYVRE Android

on:
  push:
    branches:
      - dev/delyvre
      - 'fix/delyvre-*'
      - 'feature/delyvre-*'
    paths:
      - 'mobile/eventmenu-delivery/**'
      - '.github/workflows/eventmenu-delivery-branch.yml'
      - '.github/workflows/delyvre-release.yml'
  pull_request:
    branches:
      - dev/delyvre
    paths:
      - 'mobile/eventmenu-delivery/**'
      - '.github/workflows/eventmenu-delivery-branch.yml'
      - '.github/workflows/delyvre-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delyvre-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/eventmenu-delivery
    env:
      EVENTMENU_FIREBASE_PROJECT_ID: ${{ secrets.EVENTMENU_FIREBASE_PROJECT_ID }}
      EVENTMENU_DELIVERY_FIREBASE_APP_ID: ${{ secrets.EVENTMENU_DELIVERY_FIREBASE_APP_ID }}
      EVENTMENU_FIREBASE_API_KEY: ${{ secrets.EVENTMENU_FIREBASE_API_KEY }}
      EVENTMENU_FIREBASE_SENDER_ID: ${{ secrets.EVENTMENU_FIREBASE_SENDER_ID }}
      DELYVRE_REQUIRE_FCM: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable DELYVRE debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: delyvre-debug-keystore-v1

      - name: Ensure stable DELYVRE debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=DELYVRE Development,O=EventMenu,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          DEBUG_CERT="$(keytool -exportcert -rfc -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$DEBUG_CERT"
          echo "DELYVRE_DEBUG_CERT_SHA256=$DEBUG_CERT" >> "$GITHUB_ENV"
          echo "Stable DELYVRE debug certificate SHA-256: $DEBUG_CERT"

      - name: Stamp bounded debug version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}-debug"
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Calculated Android versionCode is out of range"
            exit 1
          fi
          echo "DELYVRE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "DELYVRE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "DELYVRE debug build: $VERSION_NAME ($VERSION_CODE)"

      - name: Run DELYVRE unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run DELYVRE Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build DELYVRE debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/delyvre-debug-apksigner.txt"
          APK_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/delyvre-debug-apksigner.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT"
          if [ "$APK_CERT" != "$DELYVRE_DEBUG_CERT_SHA256" ]; then
            echo "::error::Debug APK certificate does not match the cached DELYVRE debug keystore"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | head -n 3
          mkdir -p dist-debug
          cp "$APK" "dist-debug/DELYVRE-debug-${DELYVRE_VERSION_NAME}.apk"
          sha256sum "dist-debug/DELYVRE-debug-${DELYVRE_VERSION_NAME}.apk" > "dist-debug/DELYVRE-debug-${DELYVRE_VERSION_NAME}.apk.sha256"

      - name: Smoke-test minified Release with ephemeral CI key
        shell: bash
        env:
          EVENTMENU_FIREBASE_PROJECT_ID: ci-delyvre-project
          EVENTMENU_DELIVERY_FIREBASE_APP_ID: '1:100000000000:android:delyvreci'
          EVENTMENU_FIREBASE_API_KEY: ci-delyvre-api-key
          EVENTMENU_FIREBASE_SENDER_ID: '100000000000'
          DELYVRE_REQUIRE_FCM: 'true'
          DELYVRE_REQUIRE_RELEASE_SIGNING: 'true'
          DELYVRE_RELEASE_STORE_PASSWORD: delyvre-ci-password
          DELYVRE_RELEASE_KEY_ALIAS: delyvre-ci
          DELYVRE_RELEASE_KEY_PASSWORD: delyvre-ci-password
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/delyvre-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$DELYVRE_RELEASE_STORE_PASSWORD" \
            -alias "$DELYVRE_RELEASE_KEY_ALIAS" \
            -keypass "$DELYVRE_RELEASE_KEY_PASSWORD" \
            -dname "CN=DELYVRE CI,O=EventMenu,C=BR" \
            -keyalg RSA -keysize 2048 -validity 3650
          export DELYVRE_RELEASE_KEYSTORE_PATH="$KEYSTORE"
          gradle :app:assembleRelease --stacktrace --no-daemon
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          rm -f "$KEYSTORE" "$RELEASE_APK"

      - name: Upload DELYVRE debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELYVRE-${{ github.run_number }}-debug-apk
          path: |
            mobile/eventmenu-delivery/dist-debug/DELYVRE-debug-*.apk
            mobile/eventmenu-delivery/dist-debug/DELYVRE-debug-*.sha256
          if-no-files-found: error
          retention-days: 7
