name: EventMenu CI

on:
  push:
    branches: [ main, hardening-v9.2-continuacao ]
  pull_request:
    branches: [ main ]

jobs:
  php-and-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventmenu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Validate Composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find app src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l index.php && php -l install.php && php -l update.php
      - name: Smoke tests
        run: php tests/smoke.php
      - name: Legacy UI parity
        run: php tests/legacy_ui_parity.php
      - name: Installer environment test
        run: php tests/installer_env.php
      - name: Real installer database path
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE IF EXISTS eventmenu_installer_ci; CREATE DATABASE eventmenu_installer_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=eventmenu_installer_ci DB_USERNAME=root DB_PASSWORD=root APP_KEY=ci-installer-eventmenu-key-0123456789abcdef SESSION_SECURE=false php tests/installer_database.php
      - name: Apply database schema
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot eventmenu < database/schema.sql
          for f in database/migrations/*.sql; do echo "Applying $f"; mysql -h 127.0.0.1 -uroot eventmenu < "$f"; done
      - name: Legacy parity integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_legacy
          SESSION_SECURE: 'false'
          MAIL_DRIVER: log
        run: php tests/legacy_parity_integration.php
      - name: Remember-me integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_remember
          SESSION_SECURE: 'false'
        run: php tests/remember_auth_integration.php
      - name: Delivery integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci
          SESSION_SECURE: 'false'
        run: php tests/delivery_integration.php
      - name: Scheduling integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_schedule
          SESSION_SECURE: 'false'
        run: php tests/scheduling_integration.php
      - name: POS integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_pos
          SESSION_SECURE: 'false'
        run: php tests/pos_integration.php
      - name: Fulfillment integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_fulfillment
          SESSION_SECURE: 'false'
        run: php tests/fulfillment_integration.php
      - name: Cash integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_cash
          SESSION_SECURE: 'false'
        run: php tests/cash_integration.php
      - name: NFC integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_nfc
          SESSION_SECURE: 'false'
        run: php tests/nfc_integration.php
      - name: SQLite full schema and migrations
        env:
          DB_DRIVER: sqlite
          DB_DATABASE: /tmp/eventmenu-ci.sqlite
          APP_KEY: ci-only-eventmenu-sqlite-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_sqlite
          SESSION_SECURE: 'false'
          MAIL_DRIVER: log
        run: |
          rm -f /tmp/eventmenu-ci.sqlite /tmp/eventmenu-ci.sqlite-wal /tmp/eventmenu-ci.sqlite-shm
          php tests/sqlite_installation.php
      - name: SQLite operational smoke
        env:
          DB_DRIVER: sqlite
          DB_DATABASE: /tmp/eventmenu-ci.sqlite
          APP_KEY: ci-only-eventmenu-sqlite-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_sqlite_ops
          SESSION_SECURE: 'false'
          MAIL_DRIVER: log
        run: |
          php tests/legacy_parity_integration.php
          php tests/remember_auth_integration.php
          php tests/delivery_integration.php
          php tests/scheduling_integration.php
          php tests/pos_integration.php
          php tests/fulfillment_integration.php
          php tests/cash_integration.php
          php tests/nfc_integration.php
      - name: Verify critical database objects
        env:
          MYSQL_PWD: root
        run: |
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='eventmenu' AND table_name IN ('tenants','orders','payments','tickets','restaurant_tables','coupon_reservations','refunds','login_throttles','remember_tokens','delivery_zones','delivery_events','cash_sessions','cash_movements','nfc_devices','nfc_payment_attempts','order_fulfillments','tenant_modules','business_units','user_units','user_permissions','notifications','waiter_calls','product_option_groups','product_options','order_item_options','product_combo_items','password_reset_tokens','legal_documents','legal_acceptances','backup_history','stock_reservations');" | grep -qx '31'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='orders' AND column_name IN ('scheduled_for','scheduled_slot_minutes','fulfillment_token','fulfillment_status','fulfilled_at','unit_id','cancel_reason','cancelled_at','cancelled_by');" | grep -qx '9'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='products' AND column_name IN ('unit_id','product_type','promo_price_cents','min_stock_qty','preparation_minutes','badge','featured');" | grep -qx '7'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='tickets' AND column_name IN ('transferred_at','transferred_from_customer_id');" | grep -qx '2'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='order_items' AND column_name='fulfilled_quantity';" | grep -qx '1'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='nfc_payment_attempts' AND column_name IN ('transaction_code_hash','status','amount_cents','currency','provider_payment_id','failure_reason','verified_at');" | grep -qx '7'
      - name: Build test install package
        if: github.event_name == 'push'
        run: |
          rm -rf build
          mkdir -p build/EventMenu-Premium-v9.2
          cp -a app bin database public src vendor composer.json composer.lock .env.example README.md .htaccess index.php install.php update.php build/EventMenu-Premium-v9.2/
          cat > build/EventMenu-Premium-v9.2/INSTALACAO.txt <<'EOF'
          EVENTMENU PREMIUM v9.2 — PACOTE DE TESTE

          Requisitos:
          - PHP 8.2+
          - Apache ou LiteSpeed
          - extensoes PHP: curl, json, mbstring, openssl e PDO
          - pdo_sqlite para teste sem MySQL
          - pdo_mysql + MySQL 8.0+ para producao

          TESTE DIRETO NA PASTA /1:
          1. Apague ou renomeie o conteudo antigo da pasta /1.
          2. Extraia TODO o conteudo desta pasta EventMenu-Premium-v9.2 diretamente dentro de /1.
          3. Abra https://SEU-DOMINIO/1/install.php.
          4. Escolha:
             - SQLite — teste: nao pede banco/usuario/senha e cria storage/eventmenu-test.sqlite.
             - MySQL — producao: informe host, banco, usuario e senha.
          5. Cadastre empresa e administrador e clique em Instalar.
          6. Depois abra https://SEU-DOMINIO/1/.

          A raiz possui index.php real para evitar o erro 403/Index of em hospedagens LiteSpeed.
          O .htaccess desativa listagem e bloqueia acesso web a app/, src/, database/,
          bin/, vendor/, storage/, tests/, .env e arquivos internos.

          SQLite e somente para avaliacao/testes. Para pagamentos reais e operacao de producao,
          reinstale com MySQL.
          EOF
          test -f build/EventMenu-Premium-v9.2/.htaccess
          test -f build/EventMenu-Premium-v9.2/index.php
          test -f build/EventMenu-Premium-v9.2/install.php
          test -f build/EventMenu-Premium-v9.2/public/index.php
          test -f build/EventMenu-Premium-v9.2/public/assets/app.css
      - name: Upload test install package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-v9.2-INSTALL
          path: build/EventMenu-Premium-v9.2/
          if-no-files-found: error
          retention-days: 14