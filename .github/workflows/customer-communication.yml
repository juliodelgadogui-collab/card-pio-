name: Customer Communication CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Communication smoke SQLite
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-comm-ci.sqlite
          SESSION_NAME: eventmenu_comm_sqlite
        run: |
          rm -f /tmp/eventmenu-comm-ci.sqlite /tmp/eventmenu-comm-ci.sqlite-shm /tmp/eventmenu-comm-ci.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-customer-communication-smoke.php

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eventmenu
          MYSQL_USER: eventmenu
          MYSQL_PASSWORD: eventmenu
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Communication smoke MySQL
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: eventmenu
          DB_USERNAME: eventmenu
          DB_PASSWORD: eventmenu
          SESSION_NAME: eventmenu_comm_mysql
        run: |
          php scripts/ci-db-smoke.php
          php scripts/ci-customer-communication-smoke.php
