name: EventMenu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eventmenu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Validate Composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find app public src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: /1 URL smoke test
        env:
          APP_BASE_PATH: /1
          APP_URL: https://example.test
        run: php scripts/ci-url-smoke.php
      - name: Load test safety checks
        run: |
          php scripts/load-test.php --dry-run --url=http://127.0.0.1:8080/ --requests=10 --concurrency=2
          if php scripts/load-test.php --dry-run --url=https://staging.example.test/ --requests=10 --concurrency=2; then
            echo "Remote target should have been blocked without explicit confirmation."
            exit 1
          fi
          php scripts/load-test.php --dry-run --url=https://staging.example.test/ --requests=10 --concurrency=2 --allow-remote --confirm-host=staging.example.test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore stable EventMenu GO debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu GO Development,O=EventMenu,C=BR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - name: Assemble EventMenu GO debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload EventMenu GO debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eventmenu-go-debug-apk
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: SQLite smoke test
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-ci.sqlite
          SESSION_NAME: eventmenu_ci_sqlite
        run: |
          rm -f /tmp/eventmenu-ci.sqlite /tmp/eventmenu-ci.sqlite-shm /tmp/eventmenu-ci.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-operations-smoke.php

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eventmenu
          MYSQL_USER: eventmenu
          MYSQL_PASSWORD: eventmenu
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: MySQL smoke test
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: eventmenu
          DB_USERNAME: eventmenu
          DB_PASSWORD: eventmenu
          SESSION_NAME: eventmenu_ci_mysql
        run: |
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-operations-smoke.php

  package:
    if: github.event_name == 'push'
    # O pacote do servidor é independente do app Android e, na fase inicial, depende do caminho SQLite validado.
    needs: [lint, sqlite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Build clean /1 SQLite server package
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-Servidor-SQLite-1"
      - name: Verify server package
        run: |
          PACKAGE="$RUNNER_TEMP/EventMenu-Premium-Servidor-SQLite-1"
          test -f "$PACKAGE/index.php"
          test -f "$PACKAGE/install.php"
          test -f "$PACKAGE/update.php"
          test -f "$PACKAGE/api.php"
          test -f "$PACKAGE/api-go.php"
          test -f "$PACKAGE/mesa.php"
          test -f "$PACKAGE/webhook.php"
          test -f "$PACKAGE/manifest.webmanifest"
          test -f "$PACKAGE/sw.js"
          test -f "$PACKAGE/.htaccess"
          test -f "$PACKAGE/.env.example"
          test -f "$PACKAGE/database/sqlite/schema.sql"
          test -d "$PACKAGE/database/sqlite/migrations"
          test -d "$PACKAGE/vendor"
          test -d "$PACKAGE/storage"
          grep -q '^APP_BASE_PATH=/1$' "$PACKAGE/.env.example"
          grep -q '^DB_CONNECTION=sqlite$' "$PACKAGE/.env.example"
          grep -q '^DB_SQLITE_PATH=storage/eventmenu.sqlite$' "$PACKAGE/.env.example"
      - name: Generate package checksums
        run: |
          cd "$RUNNER_TEMP/EventMenu-Premium-Servidor-SQLite-1"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-Servidor-SQLite-1
          path: ${{ runner.temp }}/EventMenu-Premium-Servidor-SQLite-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
