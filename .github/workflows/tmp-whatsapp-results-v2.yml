name: Temporary WhatsApp Results V2 Validation
on:
  push:
    branches: [feat/server-whatsapp-commerce-results-v2]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: 'curl, mbstring, openssl, pdo_sqlite'
          coverage: none
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax
        run: |
          php -l src/Services/WhatsAppCommerceAnalyticsService.php
          php -l app/routes/whatsapp-results.php
          php -l scripts/ci-whatsapp-analytics-smoke.php
      - name: WhatsApp results SQLite contract
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: package-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test/1
          APP_BASE_PATH: /1
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-whatsapp-results-v2.sqlite
          SESSION_NAME: eventmenu_whatsapp_results_v2
        run: |
          set -euo pipefail
          rm -f /tmp/eventmenu-whatsapp-results-v2.sqlite*
          php scripts/ci-db-smoke.php
          php scripts/ci-whatsapp-analytics-smoke.php
# temporary branch-only validation
