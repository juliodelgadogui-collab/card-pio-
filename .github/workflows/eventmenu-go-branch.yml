name: EventMenu GO Branch

on:
  push:
    branches:
      - dev/eventmenu-go
      - 'fix/eventmenu-go-*'
    paths:
      - 'mobile/eventmenu-go/**'
      - '.github/workflows/eventmenu-go-branch.yml'
  pull_request:
    branches:
      - dev/eventmenu-go
    paths:
      - 'mobile/eventmenu-go/**'
      - '.github/workflows/eventmenu-go-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'eventmenu-go-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    env:
      # FCM is optional for branch/debug validation. Production FCM is mandatory
      # in the dedicated EventMenu Production Release workflow.
      EVENTMENU_FIREBASE_PROJECT_ID: ${{ secrets.EVENTMENU_FIREBASE_PROJECT_ID }}
      EVENTMENU_FIREBASE_APP_ID: ${{ secrets.EVENTMENU_FIREBASE_APP_ID }}
      EVENTMENU_FIREBASE_API_KEY: ${{ secrets.EVENTMENU_FIREBASE_API_KEY }}
      EVENTMENU_FIREBASE_SENDER_ID: ${{ secrets.EVENTMENU_FIREBASE_SENDER_ID }}
      EVENTMENU_REQUIRE_FCM: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu GO Development,O=EventMenu,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Stamp bounded monotonic app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((200000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Calculated Android versionCode is out of range"
            exit 1
          fi
          echo "EVENTMENU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "EVENTMENU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "GO build version: $VERSION_NAME ($VERSION_CODE)"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 3
          mkdir -p dist-debug
          cp "$APK" "dist-debug/EventMenu-GO-debug-v${EVENTMENU_VERSION_NAME}.apk"
          sha256sum "dist-debug/EventMenu-GO-debug-v${EVENTMENU_VERSION_NAME}.apk" \
            > "dist-debug/EventMenu-GO-debug-v${EVENTMENU_VERSION_NAME}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-${{ github.run_number }}-debug-apk
          path: |
            mobile/eventmenu-go/dist-debug/EventMenu-GO-debug-*.apk
            mobile/eventmenu-go/dist-debug/EventMenu-GO-debug-*.sha256
          if-no-files-found: error
          retention-days: 7
