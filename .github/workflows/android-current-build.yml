name: EventMenu GO APK CURRENT
on:
  push:
    branches:
      - tmp/eventmenu-go-apk-build-20260917-current
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/EventMenu-GO-Atual.apk
          sha256sum artifact/EventMenu-GO-Atual.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-ATUAL
          path: mobile/eventmenu-go/artifact/EventMenu-GO-Atual.apk
          retention-days: 3
