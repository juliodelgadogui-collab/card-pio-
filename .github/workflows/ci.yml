name: EventMenu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eventmenu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Validate Composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find app public src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: /1 URL smoke test
        env:
          APP_BASE_PATH: /1
          APP_URL: https://example.test
        run: php scripts/ci-url-smoke.php

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile EventMenu GO
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: SQLite smoke test
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-ci.sqlite
          SESSION_NAME: eventmenu_ci_sqlite
        run: |
          rm -f /tmp/eventmenu-ci.sqlite /tmp/eventmenu-ci.sqlite-shm /tmp/eventmenu-ci.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-operations-smoke.php

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eventmenu
          MYSQL_USER: eventmenu
          MYSQL_PASSWORD: eventmenu
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: MySQL smoke test
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: eventmenu
          DB_USERNAME: eventmenu
          DB_PASSWORD: eventmenu
          SESSION_NAME: eventmenu_ci_mysql
        run: |
          php scripts/ci-db-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-operations-smoke.php

  package:
    if: github.event_name == 'push'
    needs: [lint, android, sqlite, mysql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Build clean /1 package
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-1"
      - name: Verify package entrypoints
        run: |
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/index.php"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/install.php"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/mesa.php"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/webhook.php"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/manifest.webmanifest"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/sw.js"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/.htaccess"
          test -f "$RUNNER_TEMP/EventMenu-Premium-1/.env.example"
          test -d "$RUNNER_TEMP/EventMenu-Premium-1/vendor"
          grep -q '^APP_BASE_PATH=/1$' "$RUNNER_TEMP/EventMenu-Premium-1/.env.example"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: EventMenu-Premium-1
          path: ${{ runner.temp }}/EventMenu-Premium-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
