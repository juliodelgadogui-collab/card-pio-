name: Generate Composer Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Resolve dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: generated-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
