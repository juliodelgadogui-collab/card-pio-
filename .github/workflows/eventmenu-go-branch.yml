name: EventMenu GO Android
on:
  push:
    branches: [dev/eventmenu-go, 'fix/eventmenu-go-*']
    paths: ['mobile/eventmenu-go/**','.github/workflows/eventmenu-go-branch.yml']
  pull_request:
    branches: [dev/eventmenu-go]
    paths: ['mobile/eventmenu-go/**','.github/workflows/eventmenu-go-branch.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'eventmenu-go-${{ github.ref }}', cancel-in-progress: true}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {working-directory: mobile/eventmenu-go}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.3.1'}
      - name: Restore stable debug signing key
        id: go-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Verify stable debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_SHA256="4D:EA:DF:DD:42:3D:9D:9B:A2:35:76:7B:5E:05:AC:44:8A:ED:B1:B8:34:A0:87:26:4F:ED:13:FD:48:8C:8A:27"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::A chave de assinatura estável do EventMenu GO não foi restaurada. O build foi interrompido para não gerar um APK incompatível com instalações existentes."
            exit 1
          fi
          ACTUAL_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d '\r')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::A assinatura restaurada não corresponde à identidade oficial do APK EventMenu GO."
            echo "Esperado: $EXPECTED_SHA256"
            echo "Encontrado: $ACTUAL_SHA256"
            exit 1
          fi
          echo "EventMenu GO signing SHA-256 verified: $ACTUAL_SHA256"
      - name: Stamp unique app version
        shell: bash
        run: |
          echo "EVENTMENU_VERSION_CODE=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "EVENTMENU_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}-b${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "GO build version: 0.2.${GITHUB_RUN_NUMBER}-b${GITHUB_RUN_ATTEMPT} (${GITHUB_RUN_ID})"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Build fresh APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-${{ github.run_number }}-debug-apk
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
