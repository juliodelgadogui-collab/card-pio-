name: EventMenu GO Branch

on:
  push:
    branches:
      - wip/eventmenu-desktop-hardware-fiscal-code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore stable EventMenu GO debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu GO Development,O=EventMenu,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Build fresh APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-Hub-debug-apk
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
