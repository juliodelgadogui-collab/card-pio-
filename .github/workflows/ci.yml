name: EventMenu CI

on:
  push:
    branches: [ main, hardening-v9.2-continuacao ]
  pull_request:
    branches: [ main ]

jobs:
  php-and-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventmenu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Validate Composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find app src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php tests/smoke.php
      - name: Apply database schema
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot eventmenu < database/schema.sql
          for f in database/migrations/*.sql; do echo "Applying $f"; mysql -h 127.0.0.1 -uroot eventmenu < "$f"; done
      - name: Delivery integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci
          SESSION_SECURE: 'false'
        run: php tests/delivery_integration.php
      - name: Scheduling integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_schedule
          SESSION_SECURE: 'false'
        run: php tests/scheduling_integration.php
      - name: POS integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_pos
          SESSION_SECURE: 'false'
        run: php tests/pos_integration.php
      - name: Cash integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_cash
          SESSION_SECURE: 'false'
        run: php tests/cash_integration.php
      - name: NFC integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eventmenu
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-only-eventmenu-key-0123456789abcdef
          SESSION_NAME: eventmenu_ci_nfc
          SESSION_SECURE: 'false'
        run: php tests/nfc_integration.php
      - name: Verify critical database objects
        env:
          MYSQL_PWD: root
        run: |
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='eventmenu' AND table_name IN ('tenants','orders','payments','tickets','restaurant_tables','coupon_reservations','refunds','login_throttles','delivery_zones','delivery_events','cash_sessions','cash_movements','nfc_devices','nfc_payment_attempts');" | grep -qx '14'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='payments' AND column_name='checkout_expires_at';" | grep -qx '1'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='orders' AND column_name IN ('delivery_zone_id','delivery_eta_min_minutes','delivery_eta_max_minutes','delivery_started_at','delivered_at','delivery_postal_code','delivery_neighborhood','delivery_city');" | grep -qx '8'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='orders' AND column_name IN ('scheduled_for','scheduled_slot_minutes');" | grep -qx '2'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='cash_sessions' AND column_name IN ('opening_balance_cents','expected_cash_cents','declared_cash_cents','difference_cents','opened_at','closed_at');" | grep -qx '6'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='cash_movements' AND column_name IN ('cash_session_id','order_id','type','method','amount_cents','idempotency_key');" | grep -qx '6'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='nfc_devices' AND column_name IN ('identifier_version','pairing_window_started_at','pairing_locked_until','last_seen_at','last_payment_at','revocation_reason','revoked_by');" | grep -qx '7'
          mysql -N -h 127.0.0.1 -uroot eventmenu -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='eventmenu' AND table_name='nfc_payment_attempts' AND column_name IN ('transaction_code_hash','status','amount_cents','currency','provider_payment_id','failure_reason','verified_at');" | grep -qx '7'
      - name: Build production install package
        if: github.event_name == 'push'
        run: |
          rm -rf build
          mkdir -p build/EventMenu-Premium-v9.2
          cp -a app bin database public src vendor composer.json composer.lock .env.example README.md build/EventMenu-Premium-v9.2/
          cat > build/EventMenu-Premium-v9.2/INSTALACAO.txt <<'EOF'
          EVENTMENU PREMIUM v9.2 — PACOTE DE INSTALACAO

          Requisitos:
          - PHP 8.2+
          - MySQL 8.0+
          - extensoes PHP: curl, json, mbstring, openssl, pdo_mysql
          - HTTPS obrigatorio em producao

          Instalacao:
          1. Envie todo o conteudo deste pacote ao servidor.
          2. Configure o DocumentRoot do dominio para a pasta public/.
          3. Copie .env.example para .env e preencha APP_URL, APP_KEY e acesso ao MySQL.
          4. Acesse /install.php pelo dominio para criar/validar o banco.
          5. Depois da instalacao, remova ou bloqueie public/install.php e public/update.php.
          6. Configure o cron do servidor para executar bin/cron.php.
          7. Cadastre gateways pelo painel; tokens e segredos nao devem ser colocados no app Android.

          Este pacote ja inclui vendor/ e nao exige Composer no servidor.
          Build gerado somente depois dos testes automaticos Delivery, Agendamento, PDV, Caixa e NFC.
          EOF
      - name: Upload production install package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-v9.2-INSTALL
          path: build/EventMenu-Premium-v9.2/
          if-no-files-found: error
          retention-days: 14
