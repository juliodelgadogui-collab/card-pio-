name: EventMenu Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão pública do EventMenu GO (ex.: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code Android. Deixe vazio para usar o número da execução.'
        required: false
        default: ''
      api_base_url:
        description: 'URL HTTPS oficial da API, terminando em /1/'
        required: true
        default: 'https://go.gestao2.store/1/'

permissions:
  contents: read

concurrency:
  group: eventmenu-production-release
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    env:
      EVENTMENU_API_BASE_URL: ${{ inputs.api_base_url }}
      EVENTMENU_VERSION_NAME: ${{ inputs.version_name }}
      EVENTMENU_FIREBASE_PROJECT_ID: ${{ secrets.EVENTMENU_FIREBASE_PROJECT_ID }}
      EVENTMENU_FIREBASE_APP_ID: ${{ secrets.EVENTMENU_FIREBASE_APP_ID }}
      EVENTMENU_FIREBASE_API_KEY: ${{ secrets.EVENTMENU_FIREBASE_API_KEY }}
      EVENTMENU_FIREBASE_SENDER_ID: ${{ secrets.EVENTMENU_FIREBASE_SENDER_ID }}
      EVENTMENU_RELEASE_STORE_PASSWORD: ${{ secrets.EVENTMENU_ANDROID_KEYSTORE_PASSWORD }}
      EVENTMENU_RELEASE_KEY_ALIAS: ${{ secrets.EVENTMENU_ANDROID_KEY_ALIAS }}
      EVENTMENU_RELEASE_KEY_PASSWORD: ${{ secrets.EVENTMENU_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validate release secrets and version
        env:
          KEYSTORE_BASE64: ${{ secrets.EVENTMENU_ANDROID_KEYSTORE_BASE64 }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 EVENTMENU_RELEASE_STORE_PASSWORD EVENTMENU_RELEASE_KEY_ALIAS EVENTMENU_RELEASE_KEY_PASSWORD EVENTMENU_FIREBASE_PROJECT_ID EVENTMENU_FIREBASE_APP_ID EVENTMENU_FIREBASE_API_KEY EVENTMENU_FIREBASE_SENDER_ID; do
            if [ -z "${!name:-}" ]; then echo "Configuração obrigatória ausente: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if ! printf '%s' "$EVENTMENU_VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "version_name inválido: $EVENTMENU_VERSION_NAME"
            exit 1
          fi
          version_code="$VERSION_CODE_INPUT"
          if [ -z "$version_code" ]; then version_code="$GITHUB_RUN_NUMBER"; fi
          if ! printf '%s' "$version_code" | grep -Eq '^[1-9][0-9]*$'; then
            echo "version_code precisa ser inteiro positivo."
            exit 1
          fi
          echo "EVENTMENU_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EVENTMENU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/eventmenu-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "EVENTMENU_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Validate keystore identity
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$EVENTMENU_RELEASE_KEYSTORE_PATH" \
            -storepass "$EVENTMENU_RELEASE_STORE_PASSWORD" \
            -alias "$EVENTMENU_RELEASE_KEY_ALIAS" >/dev/null
      - name: Run release unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon
      - name: Build signed Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon
      - name: Verify Android signatures
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB" >/dev/null
      - name: Prepare immutable release artifacts
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/eventmenu-release"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/EventMenu-GO-${EVENTMENU_VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/EventMenu-GO-${EVENTMENU_VERSION_NAME}.aab"
          cat > "$OUT/RELEASE.txt" <<EOF
          EventMenu GO ${EVENTMENU_VERSION_NAME}
          versionCode=${EVENTMENU_VERSION_CODE}
          commit=${GITHUB_SHA}
          api=${EVENTMENU_API_BASE_URL}
          workflow_run=${GITHUB_RUN_ID}
          EOF
          (cd "$OUT" && sha256sum EventMenu-GO-* RELEASE.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-Release-${{ inputs.version_name }}
          path: ${{ runner.temp }}/eventmenu-release
          if-no-files-found: error
          retention-days: 30
