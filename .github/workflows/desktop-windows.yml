name: EventMenu Desktop Windows
on:
  workflow_dispatch:
  push:
    branches: [dev/eventmenu-desktop]
    paths: ['desktop/**','.github/workflows/desktop-windows.yml']
permissions: {contents: read}
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Restore
        run: dotnet restore desktop/EventMenu.Desktop/EventMenu.Desktop.csproj
      - name: Build
        run: dotnet build desktop/EventMenu.Desktop/EventMenu.Desktop.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish desktop/EventMenu.Desktop/EventMenu.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/EventMenu-Desktop-win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup não foi encontrado após a instalação." }
          & $iscc "desktop\installer\EventMenu.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: {name: EventMenu-Desktop-win-x64, path: 'artifacts/EventMenu-Desktop-win-x64/**', if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: EventMenu-Desktop-Setup, path: 'artifacts/EventMenu-Desktop-installer/*.exe', if-no-files-found: error, retention-days: 14}
