name: EventMenu WIP Full Build

on:
  push:
    branches:
      - wip/eventmenu-delivery-customer-auth-payments
    paths:
      - '.github/workflows/build-all-wip.yml'
      - '.build-all-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-wip-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-eventmenu-go:
    name: APK - EventMenu GO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eventmenu-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore stable EventMenu GO debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu GO Development,O=EventMenu,C=BR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-debug-apk
          path: mobile/eventmenu-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest APK to go.gestao2.store
        env:
          PUBLISH_TOKEN: ${{ secrets.EVENTMENU_APK_PUBLISH_TOKEN }}
        if: ${{ env.PUBLISH_TOKEN != '' }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST 'https://go.gestao2.store/api/apk/publish' \
            -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -F 'app=eventmenu-go' \
            -F "version=0.2.${GITHUB_RUN_NUMBER}" \
            -F "version_code=${GITHUB_RUN_NUMBER}" \
            -F 'apk=@app/build/outputs/apk/debug/app-debug.apk'

  desktop-windows:
    name: Windows - EventMenu Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop/EventMenu.Desktop/EventMenu.Desktop.csproj
      - name: Build
        run: dotnet build desktop/EventMenu.Desktop/EventMenu.Desktop.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: >-
          dotnet publish desktop/EventMenu.Desktop/EventMenu.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/EventMenu-Desktop-win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup não foi encontrado após a instalação." }
          & $iscc "desktop\installer\EventMenu.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Desktop-win-x64
          path: artifacts/EventMenu-Desktop-win-x64/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Desktop-Setup
          path: artifacts/EventMenu-Desktop-installer/*.exe
          if-no-files-found: error
          retention-days: 14

  server-package:
    name: Server - EventMenu Premium WIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: 'curl, mbstring, openssl, pdo_sqlite'
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: PHP syntax validation
        run: find app public src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WhatsApp bridge syntax validation
        run: node --check integrations/whatsapp-worker/server.js
      - name: WIP contracts
        run: |
          php scripts/ci-public-ux-smoke.php
          php scripts/ci-coupon-pricing-smoke.php
          php scripts/ci-order-payment-preference-smoke.php
          php scripts/ci-native-payment-route-smoke.php
          php scripts/ci-whatsapp-smoke.php
      - name: SQLite smoke validation
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: package-eventmenu-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test/1
          APP_BASE_PATH: /1
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-package.sqlite
          SESSION_NAME: eventmenu_package_sqlite
        run: |
          set -euo pipefail
          rm -f /tmp/eventmenu-package.sqlite /tmp/eventmenu-package.sqlite-shm /tmp/eventmenu-package.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-sqlite-legacy-upgrade-smoke.php
          php scripts/ci-db-repair-page-smoke.php
          php scripts/ci-super-admin-smoke.php
          php scripts/ci-permission-smoke.php
          php scripts/ci-sensitive-rate-limit-smoke.php
          php scripts/ci-operations-smoke.php
          php scripts/ci-customer-identity-smoke.php
          php scripts/ci-loyalty-points-smoke.php
          php scripts/ci-payment-invariants-smoke.php
          php scripts/ci-marketplace-finance-smoke.php
          php scripts/ci-marketplace-native-contract-smoke.php
          php scripts/ci-delivery-customer-order-smoke.php
          php scripts/ci-auth-mail-smoke.php
          php scripts/ci-url-smoke.php
          php scripts/ci-backup-smoke.php
          php scripts/ci-operational-resilience-smoke.php
          php scripts/ci-production-readiness-smoke.php
      - name: Build server package
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-Servidor-WIP"
      - name: Verify WIP files
        run: |
          PACKAGE="$RUNNER_TEMP/EventMenu-Premium-Servidor-WIP"
          test -f "$PACKAGE/public/whatsapp.php"
          test -f "$PACKAGE/integrations/whatsapp-worker/server.js"
          test -f "$PACKAGE/integrations/whatsapp-worker/package.json"
          test -f "$PACKAGE/public/api-order-payment.php"
          test -f "$PACKAGE/src/Services/WhatsAppIntegrationService.php"
          test -f "$PACKAGE/src/Services/DeliveryOrderSchemaGuard.php"
      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP/EventMenu-Premium-Servidor-WIP"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-Servidor-WIP
          path: '${{ runner.temp }}/EventMenu-Premium-Servidor-WIP'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
