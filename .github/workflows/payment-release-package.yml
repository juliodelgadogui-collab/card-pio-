name: EventMenu Payments Release Package

on:
  push:
    branches:
      - feature/pricing-finance-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eventmenu-payments-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server package and PHP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_sqlite
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find app public src scripts -name '*.php' -print0)
          echo "PHP syntax OK"

      - name: SQLite smoke tests
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: ci-eventmenu-payments-key-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_URL: https://example.test
          APP_BASE_PATH: /1
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/eventmenu-payments-release.sqlite
          SESSION_NAME: eventmenu_payments_release
        run: |
          rm -f /tmp/eventmenu-payments-release.sqlite /tmp/eventmenu-payments-release.sqlite-shm /tmp/eventmenu-payments-release.sqlite-wal
          php scripts/ci-db-smoke.php
          php scripts/ci-operations-smoke.php
          php scripts/ci-url-smoke.php

      - name: Verify payment release modules
        shell: bash
        run: |
          set -euo pipefail
          test -f app/routes/payment-providers.php
          test -f public/sumup-oauth.php
          test -f public/api-go-payments.php
          test -f src/Services/CardPresentService.php
          test -f src/Services/PosPaymentService.php
          test -f src/Services/Payments/SumUpProvider.php
          test -f src/Services/Payments/PaymentProviderSettingsService.php
          test -f database/migrations/042_payment_provider_core.sql
          test -f database/migrations/043_payment_oauth_states.sql
          test -f database/migrations/044_payment_runtime_options.sql
          test -f database/sqlite/migrations/042_payment_provider_core.sql
          test -f database/sqlite/migrations/043_payment_oauth_states.sql
          test -f database/sqlite/migrations/044_payment_runtime_options.sql
          grep -q 'external-terminal' public/api-go-payments.php
          grep -q 'external_terminal_payments' database/migrations/044_payment_runtime_options.sql

      - name: Build server package
        run: php scripts/build-package.php "$RUNNER_TEMP/EventMenu-Premium-Servidor-Pagamentos"

      - name: Package server ZIP
        shell: bash
        run: |
          cd "$RUNNER_TEMP/EventMenu-Premium-Servidor-Pagamentos"
          zip -qr "$GITHUB_WORKSPACE/EventMenu-Premium-Servidor-Pagamentos.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum EventMenu-Premium-Servidor-Pagamentos.zip > EventMenu-Premium-Servidor-Pagamentos.sha256

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Premium-Servidor-Pagamentos
          path: |
            EventMenu-Premium-Servidor-Pagamentos.zip
            EventMenu-Premium-Servidor-Pagamentos.sha256
          if-no-files-found: error
          retention-days: 14

  source:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive current source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=EventMenu-Fonte-Pagamentos.zip HEAD
          sha256sum EventMenu-Fonte-Pagamentos.zip > EventMenu-Fonte-Pagamentos.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-Fonte-Pagamentos
          path: |
            EventMenu-Fonte-Pagamentos.zip
            EventMenu-Fonte-Pagamentos.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK validation
    runs-on: ubuntu-latest
    env:
      SUMUP_MAVEN_USERNAME: ${{ secrets.SUMUP_MAVEN_USERNAME }}
      SUMUP_MAVEN_PASSWORD: ${{ secrets.SUMUP_MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable EventMenu GO debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventmenu-go-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=EventMenu GO Development,O=EventMenu,C=BR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Compile EventMenu GO without NFC SDK
        working-directory: mobile/eventmenu-go
        run: gradle --no-daemon :app:assembleNosumupDebug

      - name: Prepare no-NFC APK
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/eventmenu-go/app/build/outputs/apk/nosumup/debug/app-nosumup-debug.apk"
          test -f "$APK"
          cp "$APK" EventMenu-GO-sem-NFC.apk
          cat > EventMenu-GO-sem-NFC-LEIA-ME.txt <<'TXT'
          EVENTMENU GO — SEM NFC/TAP TO PAY

          Esta variante funciona com PIX, dinheiro e confirmação auditada de pagamento feito em maquininha externa.
          O botão NFC/Tap to Pay não é exibido nesta variante.

          O servidor já possui a chave de ativação do NFC por empresa. Quando o APK com SDK SumUp estiver disponível,
          a mesma instalação EventMenu GO poderá usar a configuração da conta do restaurante sem APK por cliente.
          TXT
          sha256sum EventMenu-GO-sem-NFC.apk > EventMenu-GO-sem-NFC.sha256

      - name: Compile full SumUp APK when credentials exist
        if: ${{ env.SUMUP_MAVEN_USERNAME != '' && env.SUMUP_MAVEN_PASSWORD != '' }}
        working-directory: mobile/eventmenu-go
        run: gradle --no-daemon :app:assembleSumupDebug :app:assembleSumupRelease

      - name: Sign non-debuggable SumUp beta APK
        if: ${{ env.SUMUP_MAVEN_USERNAME != '' && env.SUMUP_MAVEN_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="mobile/eventmenu-go/app/build/outputs/apk/sumup/release/app-sumup-release-unsigned.apk"
          DEBUG_APK="mobile/eventmenu-go/app/build/outputs/apk/sumup/debug/app-sumup-debug.apk"
          test -f "$UNSIGNED"
          test -f "$DEBUG_APK"
          KEYSTORE="$HOME/.android/debug.keystore"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" EventMenu-GO-SumUp-beta-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out EventMenu-GO-SumUp-beta.apk EventMenu-GO-SumUp-beta-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose EventMenu-GO-SumUp-beta.apk
          cp "$DEBUG_APK" EventMenu-GO-SumUp-debug.apk
          sha256sum EventMenu-GO-SumUp-beta.apk EventMenu-GO-SumUp-debug.apk > EventMenu-GO-SumUp.sha256

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: EventMenu-GO-APK
          path: |
            EventMenu-GO-sem-NFC.apk
            EventMenu-GO-sem-NFC.sha256
            EventMenu-GO-sem-NFC-LEIA-ME.txt
            EventMenu-GO-SumUp-beta.apk
            EventMenu-GO-SumUp-debug.apk
            EventMenu-GO-SumUp.sha256
          if-no-files-found: error
          retention-days: 14
